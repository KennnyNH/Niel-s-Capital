<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niel's Capital | V1.9 Cloud Sync</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #050505; --bg-panel: #0f0f0f; --accent: #d4af37;
            --text-main: #d1d1d1; --border: #2a2a2a; --danger: #eb4034; --safe: #34eb77;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 15px; font-size: 13px; }
        .header { border-bottom: 1px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end; }
        .header h1 { color: var(--accent); margin: 0; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }
        .live-date { font-size: 11px; color: #888; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .balance-val { font-size: 22px; font-weight: bold; color: var(--accent); }
        .sidebar { position: fixed; top: 0; right: -320px; width: 320px; height: 100%; background: #0a0a0a; border-left: 1px solid var(--accent); transition: 0.3s; z-index: 1001; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .sidebar.active { right: 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 1000; }
        .overlay.active { display: block; }
        .panel { background-color: var(--bg-panel); border: 1px solid var(--border); padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        h3.panel-title { display: flex; justify-content: space-between; align-items: center; color: var(--accent); margin: 0 0 10px 0; font-size: 14px; text-transform: uppercase; border-bottom: 1px dashed var(--border); padding-bottom: 8px; }
        input, select { width: 100%; padding: 10px; margin-bottom: 12px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: var(--accent); border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th, td { padding: 10px; border-bottom: 1px solid var(--border); text-align: left; }
        .ls-toggle { display: flex; gap: 10px; margin-bottom: 12px; }
        .ls-btn { flex: 1; padding: 8px; border: 1px solid var(--border); background: #1a1a1a; color: #888; border-radius: 4px; cursor: pointer; text-align: center; font-weight: bold; }
        .ls-btn.active-long { border-color: var(--safe); color: var(--safe); background: rgba(52, 235, 119, 0.1); }
        .ls-btn.active-short { border-color: var(--danger); color: var(--danger); background: rgba(235, 64, 52, 0.1); }
        .chart-container { height: 200px; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <h2 style="color:var(--accent); font-size:16px;">NIEL'S CAPITAL MENU</h2>
        <div onclick="switchView('all')" style="padding:12px; cursor:pointer; border-bottom:1px solid #111;">🏠 TOTAL PORTFOLIO</div>
        <div onclick="switchView('saham')" style="padding:12px; cursor:pointer; border-bottom:1px solid #111;">🟢 SAHAM TERMINAL</div>
        <div onclick="switchView('crypto')" style="padding:12px; cursor:pointer; border-bottom:1px solid #111;">🔵 CRYPTO TERMINAL</div>
        
        <div style="background:#111; padding:15px; margin-top:15px; border-radius:6px;">
            <label style="font-size:10px; color:#888;">SET MODAL AUM</label>
            <input type="number" id="initSaham" placeholder="Modal Saham">
            <input type="number" id="initCrypto" placeholder="Modal Crypto">
            <button onclick="initAUM()">SIMPAN AUM</button>
        </div>
        <button onclick="clearAll()" style="background:transparent; border:1px solid var(--danger); color:var(--danger); margin-top:20px;">⚠️ FORMAT DATABASE</button>
    </div>

    <div class="header">
        <div>
            <h1>NIEL'S CAPITAL</h1>
            <div id="viewIndicator" style="font-size: 11px; color: var(--accent); font-weight: bold; margin-top: 5px;">VIEW: TOTAL PORTFOLIO</div>
            <div class="live-date" id="realTimeClock">Loading...</div>
        </div>
        <div class="balance-display" style="text-align:right;">
            <div style="font-size:10px; color:#888;">TOTAL EQUITY AUM</div>
            <div id="totalEquity" class="balance-val">Rp 0</div>
        </div>
    </div>

    <div class="panel">
        <h3 class="panel-title"><span>📊 Analytics</span><button onclick="toggleSidebar()" style="background:none; border:none; color:var(--accent); font-size:24px; cursor:pointer;">☰</button></h3>
        <div class="chart-container"><canvas id="mainChart"></canvas></div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr; gap: 15px;">
        <div class="panel">
            <h3 class="panel-title" id="execTitle">⚔️ Execution</h3>
            <div class="ls-toggle" id="lsToggleBox" style="display:none;">
                <div id="longBtn" class="ls-btn active-long" onclick="setSide('LONG')">LONG</div>
                <div id="shortBtn" class="ls-btn" onclick="setSide('SHORT')">SHORT</div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <input type="text" id="asset" placeholder="ASSET">
                <input type="number" id="riskPct" value="2" oninput="validateRisk()">
            </div>
            <div id="riskMsg" style="font-size:11px; margin-bottom:10px;"></div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <input type="number" id="entry" placeholder="ENTRY">
                <input type="number" id="sl" placeholder="STOP LOSS">
            </div>
            <button onclick="executeTrade()" id="btnExec">CONFIRM EXECUTION</button>
        </div>

        <div class="panel">
            <h3 class="panel-title">📓 Ledger</h3>
            <div style="overflow-x:auto;">
                <table>
                    <thead><tr><th>Asset</th><th>Risk Rp</th><th>Size</th><th>Entry</th><th>Exit</th><th>Status</th></tr></thead>
                    <tbody id="ledgerBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- KONFIGURASI CLOUD SYNC ---
        // Ganti teks di bawah ini dengan link Web App URL lu!
        const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbzP6TpmDU_lLBCRrPK5m7hehEN3fGfWXji78UNKrPIBvl3gZsmcqdoFBAVuaBo8kJPJ/exec";

        let currentView = 'all'; let currentSide = 'LONG'; 
        let balSaham = parseFloat(localStorage.getItem('n_s_bal')) || 0;
        let balCrypto = parseFloat(localStorage.getItem('n_c_bal')) || 0;
        let histSaham = JSON.parse(localStorage.getItem('n_s_hist')) || [];
        let histCrypto = JSON.parse(localStorage.getItem('n_c_hist')) || [];
        let mainChart = null;

        function updateRealTimeClock() {
            const now = new Date();
            document.getElementById('realTimeClock').innerText = now.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' }) + " WIB";
        }
        setInterval(updateRealTimeClock, 1000); updateRealTimeClock();

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }

        async function syncToCloud(trade, type) {
            if(CLOUD_API_URL.includes("ISI_LINK")) return;
            const payload = {
                type: type === 'saham' ? 'Saham' : 'Crypto',
                date: new Date().toLocaleString('id-ID'),
                asset: trade.asset,
                side: trade.side,
                entry: trade.entry,
                exit: trade.exit || '-',
                status: trade.status,
                riskRp: trade.riskRp,
                leverage: trade.leverage.toFixed(4),
                equityAfter: trade.equityAfter
            };
            try {
                await fetch(CLOUD_API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                console.log("Cloud Sync Success!");
            } catch(e) { console.error("Cloud Sync Error", e); }
        }

        function switchView(view) {
            currentView = view;
            document.getElementById('viewIndicator').innerText = `VIEW: ${view === 'all' ? 'TOTAL PORTFOLIO' : view.toUpperCase()}`;
            document.getElementById('execTitle').innerText = `⚔️ EXECUTION: ${view === 'all' ? 'SAHAM' : view.toUpperCase()}`;
            document.getElementById('lsToggleBox').style.display = view === 'crypto' ? 'flex' : 'none';
            toggleSidebar(); updateUI();
        }

        function validateRisk() {
            const pct = parseFloat(document.getElementById('riskPct').value);
            const activeBal = (currentView === 'crypto') ? balCrypto : balSaham;
            const rp = activeBal * (pct/100);
            const msg = document.getElementById('riskMsg');
            msg.innerText = isNaN(rp) ? "" : `🛡️ Risk: Rp ${Math.floor(rp).toLocaleString('id-ID')}`;
            msg.style.color = pct > 5 ? 'var(--danger)' : 'var(--safe)';
        }

        function executeTrade() {
            const asset = document.getElementById('asset').value.toUpperCase();
            const riskP = parseFloat(document.getElementById('riskPct').value);
            const entry = parseFloat(document.getElementById('entry').value);
            const sl = parseFloat(document.getElementById('sl').value);
            const type = (currentView === 'crypto') ? 'crypto' : 'saham';
            let activeBal = type === 'saham' ? balSaham : balCrypto;

            if(!asset || isNaN(entry) || isNaN(sl) || activeBal === 0) return alert("Cek data / Modal masih 0!");

            const riskRp = activeBal * (riskP / 100);
            const leverage = Math.abs(riskRp / (entry - sl));
            const trade = { asset, riskRp, leverage, entry, sl, side: currentSide, status: 'PENDING', exit: null, equityAfter: activeBal };
            
            if(type === 'saham') histSaham.push(trade); else histCrypto.push(trade);
            save(); updateUI(); 
            syncToCloud(trade, type); // Panggil fungsi sync ke Google Sheets
            
            document.getElementById('asset').value = ''; document.getElementById('entry').value = ''; document.getElementById('sl').value = '';
        }

        function updateUI() {
            document.getElementById('totalEquity').innerText = `Rp ${(balSaham + balCrypto).toLocaleString('id-ID')}`;
            const body = document.getElementById('ledgerBody'); body.innerHTML = '';
            let activeHist = currentView === 'crypto' ? histCrypto : (currentView === 'saham' ? histSaham : [...histSaham, ...histCrypto]);
            
            activeHist.slice().reverse().forEach((t, i) => {
                body.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td><b>${t.asset}</b></td>
                        <td>${Math.floor(t.riskRp).toLocaleString('id-ID')}</td>
                        <td style="color:var(--accent)">${t.leverage.toFixed(3)}</td>
                        <td>${t.entry.toLocaleString()}</td>
                        <td>-</td>
                        <td style="color:var(--accent)">${t.status}</td>
                    </tr>
                `);
            });
            renderChart();
        }

        function renderChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if(mainChart) mainChart.destroy();
            mainChart = new Chart(ctx, { type: 'doughnut', data: { labels: ['Saham', 'Crypto'], datasets: [{ data: [balSaham, balCrypto], backgroundColor: ['#34eb77', '#00d2ff'], borderWidth: 0 }] }, options: { maintainAspectRatio: false } });
        }

        function save() { localStorage.setItem('n_s_bal', balSaham); localStorage.setItem('n_c_bal', balCrypto); localStorage.setItem('n_s_hist', JSON.stringify(histSaham)); localStorage.setItem('n_c_hist', JSON.stringify(histCrypto)); }
        function setSide(s) { currentSide = s; document.getElementById('longBtn').className = s === 'LONG' ? 'ls-btn active-long' : 'ls-btn'; document.getElementById('shortBtn').className = s === 'SHORT' ? 'ls-btn active-short' : 'ls-btn'; }
        function initAUM() { balSaham = parseFloat(document.getElementById('initSaham').value) || 0; balCrypto = parseFloat(document.getElementById('initCrypto').value) || 0; save(); updateUI(); toggleSidebar(); }
        function clearAll() { if(confirm("FORMAT DATABASE?")) { localStorage.clear(); location.reload(); } }
        updateUI();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niel's Capital | V2.4 PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #050505; --bg-panel: #0f0f0f; --accent: #d4af37;
            --text-main: #d1d1d1; --border: #2a2a2a; --danger: #eb4034; --safe: #34eb77;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 15px; font-size: 13px; }
        
        /* Header Fix - Pinned Hamburger */
        .header { border-bottom: 1px solid var(--accent); padding-bottom: 15px; margin-bottom: 20px; position: relative; }
        .header h1 { color: var(--accent); margin: 0; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }
        .menu-trigger { position: absolute; top: 0; right: 0; background: none; border: none; color: var(--accent); font-size: 35px; cursor: pointer; z-index: 1002; }
        .live-date { font-size: 11px; color: #888; margin-top: 5px; text-transform: uppercase; }

        /* AUM Card */
        .balance-card { background: linear-gradient(145deg, #0f0f0f, #1a1a1a); border: 1px solid var(--accent); padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        .balance-val { font-size: 24px; font-weight: bold; color: var(--accent); margin-top: 5px; }

        /* Sidebar & Menu */
        .sidebar { position: fixed; top: 0; right: -320px; width: 300px; height: 100%; background: #0a0a0a; border-left: 1px solid var(--accent); transition: 0.3s; z-index: 1100; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .sidebar.active { right: 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 1050; }
        .overlay.active { display: block; }
        .nav-item { padding: 15px 0; cursor: pointer; border-bottom: 1px solid #1a1a1a; font-weight: bold; }
        .nav-item:hover { color: var(--accent); }

        .panel { background-color: var(--bg-panel); border: 1px solid var(--border); padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        h3.panel-title { color: var(--accent); margin: 0 0 12px 0; font-size: 12px; text-transform: uppercase; border-bottom: 1px dashed var(--border); padding-bottom: 8px; }
        
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 4px; box-sizing: border-box; }
        button.btn-main { width: 100%; padding: 15px; background: var(--accent); border: none; font-weight: bold; cursor: pointer; border-radius: 4px; color: #000; text-transform: uppercase; }
        
        /* Table Style */
        table { width: 100%; border-collapse: collapse; font-size: 10px; }
        th, td { padding: 10px 5px; border-bottom: 1px solid var(--border); text-align: left; }
        .exit-input { width: 70px; background: #000; border: 1px solid #333; color: #fff; padding: 5px; border-radius: 3px; }
        .pnl-plus { color: var(--safe); font-weight: bold; }
        .pnl-minus { color: var(--danger); font-weight: bold; }

        .ls-toggle { display: flex; gap: 8px; margin-bottom: 12px; }
        .ls-btn { flex: 1; padding: 10px; border: 1px solid var(--border); background: #111; color: #555; border-radius: 4px; cursor: pointer; font-weight: bold; text-align: center; }
        .ls-btn.active-long { border-color: var(--safe); color: var(--safe); background: rgba(52, 235, 119, 0.1); }
        .ls-btn.active-short { border-color: var(--danger); color: var(--danger); background: rgba(235, 64, 52, 0.1); }
        
        .chart-container { position: relative; height: 180px; width: 100%; }
        #priceStatus { font-size: 10px; color: var(--accent); margin-top: -8px; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    
    <div class="sidebar" id="sidebar">
        <h2 style="color:var(--accent); font-size:16px;">NIEL'S MENU</h2>
        <div class="nav-item" onclick="switchView('all')">🏠 ALL PORTFOLIO</div>
        <div class="nav-item" onclick="switchView('saham')">🟢 SAHAM TERMINAL</div>
        <div class="nav-item" onclick="switchView('crypto')">🔵 CRYPTO TERMINAL</div>
        
        <div style="margin-top:20px; background:#111; padding:15px; border-radius:5px;">
            <label style="font-size:9px; color:#888;">SET MODAL AUM</label>
            <input type="number" id="initSaham" placeholder="Modal Saham">
            <input type="number" id="initCrypto" placeholder="Modal Crypto">
            <button onclick="initAUM()" style="background:var(--accent); width:100%; padding:10px; border:none; font-weight:bold;">UPDATE AUM</button>
        </div>

        <div style="margin-top:20px; background:#111; padding:15px; border-radius:5px;">
            <label style="font-size:9px; color:#888;">📂 DATA MANAGER</label>
            <button onclick="exportAllData()" style="background:transparent; border:1px solid var(--accent); color:var(--accent); margin-bottom:10px;">📥 BACKUP DATA (CSV)</button>
            <input type="file" id="csvFile" style="font-size:10px; margin-bottom:5px;">
            <button onclick="injectCSV()" style="background:#fff; color:#000;">⚡ INJECT CSV</button>
        </div>
        
        <button onclick="clearAll()" style="background:none; border:1px solid var(--danger); color:var(--danger); width:100%; margin-top:20px; padding:10px;">⚠️ FORMAT DB</button>
    </div>

    <div class="header">
        <h1>NIEL'S CAPITAL</h1>
        <div id="viewIndicator" style="font-size: 11px; color: var(--accent); font-weight: bold;">VIEW: ALL PORTFOLIO</div>
        <div class="live-date" id="realTimeClock">Loading...</div>
        <button class="menu-trigger" onclick="toggleSidebar()">☰</button>
    </div>

    <div class="balance-card">
        <div style="font-size: 10px; color: #888;">TOTAL EQUITY AUM</div>
        <div id="totalEquity" class="balance-val">Rp 0</div>
    </div>

    <div class="panel">
        <h3 class="panel-title">📊 ANALYTICS</h3>
        <div class="chart-container"><canvas id="mainChart"></canvas></div>
    </div>

    <div class="panel">
        <h3 class="panel-title" id="execTitle">⚔️ EXECUTION</h3>
        <div class="ls-toggle" id="lsBox" style="display:none;">
            <div id="btnL" class="ls-btn active-long" onclick="setSide('LONG')">LONG</div>
            <div id="btnS" class="ls-btn" onclick="setSide('SHORT')">SHORT</div>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <input type="text" id="asset" placeholder="KOIN (e.g. bitcoin)" onchange="getLivePrice()">
            <input type="number" id="riskP" value="2" oninput="valRisk()">
        </div>
        <span id="priceStatus"></span>
        <div id="riskMsg" style="font-size:11px; margin-bottom:10px; font-weight:bold;"></div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <input type="number" id="entry" placeholder="ENTRY PRICE">
            <input type="number" id="sl" placeholder="STOP LOSS">
        </div>
        <button class="btn-main" onclick="executeTrade()">Confirm Trade</button>
    </div>

    <div class="panel">
        <h3 class="panel-title">📓 TRANSACTION LEDGER</h3>
        <div style="overflow-x:auto;">
            <table>
                <thead><tr><th>ASSET</th><th>ENTRY</th><th>EXIT</th><th>PROFIT</th><th>STATUS</th></tr></thead>
                <tbody id="ledgerBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // --- KONFIGURASI ---
        const CLOUD_URL = "ISI_LINK_WEB_APP_LU_DISINI";

        let currentView = 'all'; let currentSide = 'LONG';
        let balS = parseFloat(localStorage.getItem('n_s_bal')) || 0;
        let balC = parseFloat(localStorage.getItem('n_c_bal')) || 0;
        let histS = JSON.parse(localStorage.getItem('n_s_hist')) || [];
        let histC = JSON.parse(localStorage.getItem('n_c_hist')) || [];
        let mainChart = null;

        function updateClock() {
            const n = new Date();
            document.getElementById('realTimeClock').innerText = n.toLocaleString('id-ID', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit', second:'2-digit'}) + " WIB";
        }
        setInterval(updateClock, 1000); updateClock();

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }

        async function getLivePrice() {
            const assetName = document.getElementById('asset').value.toLowerCase().trim();
            if(!assetName || currentView !== 'crypto') return;
            document.getElementById('priceStatus').innerText = "⏳ Memeriksa Harga...";
            try {
                const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${assetName}&vs_currencies=idr`);
                const data = await res.json();
                if(data[assetName]) {
                    const price = data[assetName].idr;
                    document.getElementById('entry').value = price;
                    document.getElementById('priceStatus').innerText = `✅ Harga ${assetName.toUpperCase()}: Rp ${price.toLocaleString()}`;
                } else { document.getElementById('priceStatus').innerText = "❌ Gunakan nama lengkap (misal: 'bitcoin')"; }
            } catch(e) { document.getElementById('priceStatus').innerText = "❌ Gagal koneksi."; }
        }

        function switchView(v) {
            currentView = v;
            document.getElementById('viewIndicator').innerText = `VIEW: ${v === 'all' ? 'ALL PORTFOLIO' : v.toUpperCase()}`;
            document.getElementById('execTitle').innerText = `⚔️ EXECUTION: ${v === 'all' ? 'SAHAM' : v.toUpperCase()}`;
            document.getElementById('lsBox').style.display = v === 'crypto' ? 'flex' : 'none';
            toggleSidebar(); updateUI();
        }

        function valRisk() {
            const p = parseFloat(document.getElementById('riskP').value);
            const active = (currentView === 'crypto') ? balC : balS;
            const rp = active * (p/100);
            const m = document.getElementById('riskMsg');
            m.innerText = isNaN(rp) ? "" : `🛡️ Risk: Rp ${Math.floor(rp).toLocaleString('id-ID')}`;
            m.style.color = p > 5 ? 'var(--danger)' : 'var(--safe)';
        }

        async function sync(trade, type) {
            if(CLOUD_URL.includes("ISI_LINK")) return;
            const data = { type, date: trade.date, asset: trade.asset, side: trade.side, entry: trade.entry, exit: trade.exit || '-', status: trade.status, riskRp: Math.floor(trade.riskRp), leverage: trade.leverage.toFixed(4), equityAfter: Math.floor(trade.equityAfter) };
            try { fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) }); } catch(e){}
        }

        function executeTrade() {
            const asset = document.getElementById('asset').value.toUpperCase();
            const rP = parseFloat(document.getElementById('riskP').value);
            const ent = parseFloat(document.getElementById('entry').value);
            const sl = parseFloat(document.getElementById('sl').value);
            const type = (currentView === 'crypto') ? 'crypto' : 'saham';
            let active = type === 'saham' ? balS : balC;

            if(!asset || isNaN(ent) || isNaN(sl) || active === 0) return alert("Cek Input!");
            const riskRp = active * (rP / 100);
            const lev = Math.abs(riskRp / (ent - sl));
            const trade = { date: new Date().toLocaleDateString('id-ID'), asset, riskRp, leverage: lev, entry: ent, sl, side: currentSide, status: 'OPEN', exit: null, pnl: 0, equityAfter: active };
            if(type === 'saham') histS.push(trade); else histC.push(trade);
            save(); updateUI(); sync(trade, type === 'saham' ? 'Saham' : 'Crypto');
            document.getElementById('asset').value = ''; document.getElementById('entry').value = ''; document.getElementById('sl').value = '';
        }

        function updateExit(idx, val, type) {
            let list = type === 'saham' ? histS : histC;
            let trade = list[idx];
            trade.exit = parseFloat(val);
            if(!isNaN(trade.exit)) {
                let win = trade.side === 'LONG' ? (trade.exit > trade.entry) : (trade.exit < trade.entry);
                trade.status = win ? 'WIN' : 'LOSS';
                trade.pnl = win ? (trade.riskRp * 2) : -trade.riskRp;
                if(type === 'saham') balS += trade.pnl; else balC += trade.pnl;
                trade.equityAfter = (type === 'saham' ? balS : balC);
                sync(trade, type === 'saham' ? 'Saham' : 'Crypto');
            }
            save(); updateUI();
        }

        // --- DATA MANAGER FUNCTIONS ---
        function exportAllData() {
            const data = [...histS.map(t=>({...t, Type:'Saham'})), ...histC.map(t=>({...t, Type:'Crypto'}))];
            if(data.length === 0) return alert("Data kosong!");
            const csv = Papa.unparse(data);
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `NielsCapital_Backup_${new Date().toLocaleDateString()}.csv`;
            link.click();
        }

        function injectCSV() {
            const file = document.getElementById('csvFile').files[0];
            if(!file) return alert("Pilih file CSV!");
            Papa.parse(file, { header: true, complete: function(res) {
                res.data.forEach(row => {
                    const t = { date: row.date, asset: row.asset, riskRp: parseFloat(row.riskRp), leverage: parseFloat(row.leverage), entry: parseFloat(row.entry), sl: parseFloat(row.sl), side: row.side, status: row.status, exit: parseFloat(row.exit), pnl: parseFloat(row.pnl), equityAfter: parseFloat(row.equityAfter) };
                    if(row.Type === 'Saham') histS.push(t); else histC.push(t);
                });
                save(); updateUI(); alert("Inject Sukses!");
            }});
        }

        function updateUI() {
            document.getElementById('totalEquity').innerText = `Rp ${(balS + balC).toLocaleString('id-ID')}`;
            const body = document.getElementById('ledgerBody'); body.innerHTML = '';
            let active = currentView === 'crypto' ? histC : (currentView === 'saham' ? histS : [...histS, ...histC]);
            active.slice().reverse().forEach((t, i) => {
                let realIdx = active.length - 1 - i;
                let pClass = t.pnl > 0 ? 'pnl-plus' : (t.pnl < 0 ? 'pnl-minus' : '');
                body.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td><b>${t.asset}</b><br><small style="color:#666">${t.date}</small></td>
                        <td>${t.entry.toLocaleString()}</td>
                        <td><input type="number" class="exit-input" value="${t.exit||''}" onchange="updateExit(${realIdx}, this.value, '${currentView==='crypto'?'crypto':'saham'}')"></td>
                        <td class="${pClass}">${t.pnl !== 0 ? 'Rp ' + Math.floor(t.pnl).toLocaleString() : '-'}</td>
                        <td style="color:var(--accent); font-weight:bold;">${t.status}</td>
                    </tr>
                `);
            });
            renderChart();
        }

        function renderChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if(mainChart) mainChart.destroy();
            mainChart = new Chart(ctx, { type: 'doughnut', data: { labels: ['Saham', 'Crypto'], datasets: [{ data: [balS, balC], backgroundColor: ['#34eb77', '#00d2ff'], borderWidth: 0 }] }, options: { maintainAspectRatio: false } });
        }

        function save() { localStorage.setItem('n_s_bal', balS); localStorage.setItem('n_c_bal', balC); localStorage.setItem('n_s_hist', JSON.stringify(histS)); localStorage.setItem('n_c_hist', JSON.stringify(histC)); }
        function setSide(s) { currentSide = s; document.getElementById('btnL').className = s === 'LONG' ? 'ls-btn active-long' : 'ls-btn'; document.getElementById('btnS').className = s === 'SHORT' ? 'ls-btn active-short' : 'ls-btn'; }
        function initAUM() { balS = parseFloat(document.getElementById('initSaham').value) || 0; balC = parseFloat(document.getElementById('initCrypto').value) || 0; save(); updateUI(); toggleSidebar(); }
        function clearAll() { if(confirm("Format DB?")) { localStorage.clear(); location.reload(); } }
        updateUI();
    </script>
</body>
</html>
